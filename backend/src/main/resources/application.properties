spring.application.name=skope
server.address=127.0.0.1
server.port=${PORT:8080}
spring.profiles.default=demo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/skope;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
logging.level.org.springframework.security=INFO
spring.jackson.time-zone=Asia/Seoul
